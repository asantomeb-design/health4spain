<style>
:root{ color-scheme: light; --navy:#0C3A66; --blue:#185FA5; --cyan:#43BEDA; --green:#1FA855; --bg:#eef3f9; --card:rgba(255,255,255,.9); --line:#e2e9f1; --txt:#1d2b3a; --muted:#5f7184; }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='160'><text x='6' y='95' font-family='Arial,sans-serif' font-weight='700' font-size='21' fill='%230C3A66' fill-opacity='0.05' transform='rotate(-22 125 80)'>U4S · Health4Spain</text></svg>");color:var(--txt);line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:14px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.langsel{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:var(--navy);font-weight:600}
.langbar{display:flex;gap:3px;flex-wrap:wrap}.lb{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:12px;padding:6px 9px;border-radius:6px;cursor:pointer}.lb.active{background:var(--navy);color:#fff;border-color:var(--navy)}.contacto{background:var(--navy);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 14px;border-radius:8px;white-space:nowrap}
@media(max-width:520px){.wrap{padding:12px 12px 50px}.hero{padding:22px 16px}.hero h1{font-size:24px}.row{flex-wrap:wrap}.row b{min-width:auto;display:block;margin-bottom:1px}.contacto{padding:7px 10px;font-size:12px}.btn{font-size:13px;padding:10px 12px}.proftile{font-size:13px}.tab{font-size:12.5px;padding:10px 8px}.cityttl{font-size:19px}.maplink{white-space:normal}}
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#0C3A66 0%,#185FA5 55%,#43BEDA 100%);color:#fff;padding:28px 24px;margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px;font-weight:800}
.hero p{margin:0;font-size:15px;color:#dceaf7;max-width:560px}
.hero .kick{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:12px}
.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:640px){.nav{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:34px}}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--navy);text-align:center;line-height:1.3}
.tab .e{display:block;font-size:20px;margin-bottom:4px}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.view{display:none}.view.active{display:block}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.citybtn{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--navy)}
.citybtn:hover{border-color:var(--blue)}
.citybtn small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-costa{background:#e1f1fb;color:#0d4a7a}.b-int{background:#eaf3de;color:#3b6d11}.b-own{background:#e7f7ee;color:#0f6e44}.b-ref{background:#fdeede;color:#8a5a0b}
.cityttl{font-size:21px;color:var(--navy);margin:0 0 2px;font-weight:800}
.refnote{background:#fff6e9;border:1px solid #f3dcb4;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#7a4f06;margin:10px 0}
.row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:none}
.row b{color:var(--navy);min-width:104px;display:inline-block}
.ico{width:18px;text-align:center;color:var(--blue);flex:0 0 18px}
.maplink{color:var(--blue);font-size:13px;text-decoration:none;font-weight:600;white-space:nowrap}
.sec{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sec h4{margin:0 0 6px;color:var(--blue);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.help{margin-top:8px;background:#eef5fc;border:1px solid #d7e6f6;border-radius:10px;padding:10px 12px}
.help .ht{font-size:12.5px;color:var(--navy)}
.help .hcta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.scta{display:inline-block;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer}
.scta:hover{background:var(--blue);color:#fff}.scta::after{content:' ↗';font-weight:800}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:13.5px;padding:10px 14px;border-radius:10px;text-align:center;cursor:pointer;border:none}
.btn-wa{background:var(--green);color:#fff}.btn-info{background:var(--blue);color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn.dis{opacity:.45;pointer-events:none}
h3{color:var(--navy);font-size:17px;margin:18px 0 6px}
.step{display:flex;gap:12px;margin:12px 0}.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.step b{color:var(--navy)}.step p{margin:2px 0;font-size:14px}
.tasa{background:#eef5fc;border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--navy);margin:8px 0}
ul.tight{margin:6px 0;padding-left:20px}.tight li{font-size:14px;margin:3px 0}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.proftile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}.proftile:hover{border-color:var(--blue)}.proftile .e{font-size:22px;display:block;margin-bottom:4px}
.pill{display:inline-block;background:#eaf1f8;color:var(--navy);border-radius:999px;padding:6px 11px;font-size:13px;margin:4px 6px 0 0;cursor:pointer;font-weight:600;border:1px solid #d6e3f0}.pill:hover{background:var(--navy);color:#fff}.pill.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.assoc{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.assoc:first-of-type{border-top:none}.assoc b{color:var(--navy)}.assoc .meta{color:var(--muted);font-size:12.5px;margin-top:2px}.assoc a{color:var(--blue)}
.consent{display:flex;gap:8px;align-items:flex-start;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 12px}
.consent input{margin-top:3px}
.consent label{font-size:12.5px;color:#eaf3fb}
.rgpd{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
select.full{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--txt)}
.bform label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 5px}
.bform .opts{display:flex;gap:8px;flex-wrap:wrap}
.bform .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--navy)}
.bform .opt.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.itstep{display:flex;gap:12px;margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.itstep .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.itstep b{color:var(--navy)}.itstep p{margin:3px 0;font-size:13.5px}
.print-head{display:none}
@media print{body{background:none!important}.topbar,.hero,.nav,.foot,#bform-wrap{display:none!important}.view{display:none!important}#v-crear{display:block!important}.help,.cta,.scta,.btn,.rgpd,.maplink{display:none!important}.print-head{display:block!important}.itstep{border-color:#ccc}}
</style>
</head>

 <div class="sec"><h4>${esc(t.secTrans)}</h4>

function renderLoc(){$('#locList').innerHTML=LOC.map(a=>`<div class="assoc"><b>${esc(a.n)}</b><div class="meta">${esc(a.loc)}${a.m?' · '+esc(a.m):''}${a.w?` · <a href="${a.w}" target="_blank" rel="noopener">web</a>`:''}</div></div>`).join('');}
